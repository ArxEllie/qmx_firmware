# Nightly build flow.
# Run on a schedule via a Woodpecker cron job named "nightly"
# (Repo Settings -> Crons).
#
# Always compiles every target (catches breakage from upstream merges) and
# publishes a dated "nightly-YYYY-MM-DD" pre-release on Forgejo.
#
# Note: this PUBLISHES, so it is intentionally not on the `manual` event -
# use build.yaml to manually test a build without side effects.

when:
  - event: cron
    cron: nightly

steps:
  - name: build
    image: qmkfm/qmk_cli
    commands:
      - pip install -q -r requirements.txt
      - make git-submodule
      - mkdir -p dist
      - make -j"$(nproc)" nuphy/halo75_v2/ansi:default
      - make -j"$(nproc)" nuphy/halo75_v2/ansi:via
      - make -j"$(nproc)" nuphy/halo75_v2/iso:default
      - make -j"$(nproc)" nuphy/halo75_v2/iso:via
      - for ext in bin hex uf2; do for f in *.$ext; do [ -f "$f" ] && mv "$f" dist/; done; done
      - (cd dist && sha256sum -- * > SHA256SUMS)
      - ls -la dist

  - name: publish-nightly
    image: alpine:3.20
    environment:
      FORGEJO_TOKEN:
        from_secret: forgejo_token
    commands:
      - apk add --no-cache curl jq
      - |
        set -eu
        if [ -n "${CI_REPO_LINK:-}" ] && [ -n "${CI_REPO_OWNER:-}" ] && [ -n "${CI_REPO_NAME:-}" ]; then
          FORGE_URL="${CI_REPO_LINK%/}"
          FORGE_URL="${FORGE_URL%/$CI_REPO_NAME}"
          FORGE_URL="${FORGE_URL%/$CI_REPO_OWNER}"
        else
          FORGE_URL="${CI_FORGE_URL%/}"
        fi
        case "$FORGE_URL" in http://*|https://*) ;; *) FORGE_URL="https://$FORGE_URL" ;; esac

        if [ -n "${CI_REPO_OWNER:-}" ] && [ -n "${CI_REPO_NAME:-}" ]; then
          REPO_SLUG="$CI_REPO_OWNER/$CI_REPO_NAME"
        else
          REPO_SLUG="${CI_REPO:?CI_REPO is not set}"
        fi

        NIGHTLY_VERSION="nightly-$(date -u +%Y-%m-%d)"
        PACKAGE_NAME="nuphy-halo75-v2"
        REPO_API="$FORGE_URL/api/v1/repos/$REPO_SLUG"
        PACKAGE_API="$FORGE_URL/api/packages/$CI_REPO_OWNER/generic/$PACKAGE_NAME/$NIGHTLY_VERSION"

        AUTH="Authorization: token $FORGEJO_TOKEN"
        auth_status="$(curl -sS -o /tmp/auth.json -w '%{http_code}' -H "$AUTH" "$FORGE_URL/api/v1/user")"
        if [ "$auth_status" != "200" ]; then
          AUTH="Authorization: Bearer $FORGEJO_TOKEN"
          auth_status="$(curl -sS -o /tmp/auth.json -w '%{http_code}' -H "$AUTH" "$FORGE_URL/api/v1/user")"
        fi
        if [ "$auth_status" != "200" ]; then
          echo "Forgejo token authentication failed with HTTP $auth_status"
          cat /tmp/auth.json
          exit 1
        fi

        echo "Publishing $PACKAGE_NAME $NIGHTLY_VERSION to $REPO_SLUG packages"
        repo_status="$(curl -sS -o /tmp/repo.json -w '%{http_code}' -H "$AUTH" "$REPO_API")"
        if [ "$repo_status" != "200" ]; then
          echo "Forgejo repo lookup failed with HTTP $repo_status for $REPO_SLUG"
          cat /tmp/repo.json
          exit 1
        fi

        for f in dist/*; do
          [ -f "$f" ] || continue
          name="$(basename "$f")"
          url="$PACKAGE_API/$name"
          curl -fsSL -X DELETE -H "$AUTH" "$url" >/dev/null 2>&1 || true
          upload_status="$(curl -sS -o /tmp/package.json -w '%{http_code}' -X PUT -H "$AUTH" --upload-file "$f" "$url")"
          if [ "$upload_status" != "201" ] && [ "$upload_status" != "200" ]; then
            echo "Forgejo package upload failed with HTTP $upload_status for $name"
            cat /tmp/package.json
            exit 1
          fi
          echo "Uploaded $name"
        done
