# Nightly build flow.
# Run on a schedule via a Woodpecker cron job named "nightly"
# (Repo Settings -> Crons). Can also be triggered manually from the UI.
#
# Always compiles every target (catches breakage from upstream merges) and
# publishes/refreshes a rolling "nightly" pre-release on Forgejo.

when:
  - event: cron
    cron: nightly
  - event: manual

steps:
  - name: build
    image: qmkfm/qmk_cli
    commands:
      - sh .woodpecker/scripts/build.sh

  - name: publish-nightly
    image: alpine:3.20
    environment:
      FORGEJO_TOKEN:
        from_secret: forgejo_token
    commands:
      - apk add --no-cache curl jq
      - sh .woodpecker/scripts/publish-forgejo.sh nightly true "Nightly build"
