# Nightly build flow.
# Run on a schedule via a Woodpecker cron job named "nightly"
# (Repo Settings -> Crons).
#
# Publishes a rolling "nightly" pre-release visible in Forgejo's Releases tab.

when:
  - event: cron
    cron: nightly
  - event: manual

steps:
  - name: build
    image: qmkfm/qmk_cli
    commands:
      - pip install -q -r requirements.txt
      - make git-submodule
      - mkdir -p dist
      - make -j"$(nproc)" nuphy/halo75_v2/ansi:default
      - make -j"$(nproc)" nuphy/halo75_v2/ansi:via
      - make -j"$(nproc)" nuphy/halo75_v2/iso:default
      - make -j"$(nproc)" nuphy/halo75_v2/iso:via
      - for ext in bin hex uf2; do for f in *.$ext; do [ -f "$f" ] && mv "$f" dist/; done; done
      - (cd dist && sha256sum -- * > SHA256SUMS)
      - ls -la dist

  - name: publish-release
    image: alpine:3.20
    environment:
      FORGEJO_TOKEN:
        from_secret: forgejo_token
      CI_REPO: "${CI_REPO}"
      CI_COMMIT_SHA: "${CI_COMMIT_SHA}"
      CI_FORGE_URL: "${CI_FORGE_URL}"
    commands:
      - apk add --no-cache curl jq
      - sh .woodpecker/scripts/publish-forgejo.sh nightly true "Nightly build"
