# Nightly build flow.
# Run on a schedule via a Woodpecker cron job named "nightly"
# (Repo Settings -> Crons).
#
# Always compiles every target (catches breakage from upstream merges) and
# publishes a dated "nightly-YYYY-MM-DD" pre-release on Forgejo.
#
# Note: this PUBLISHES, so it is intentionally not on the `manual` event -
# use build.yaml to manually test a build without side effects.

when:
  - event: cron
    cron: nightly

steps:
  - name: build
    image: qmkfm/qmk_cli
    commands:
      - pip install -q -r requirements.txt
      - make git-submodule
      - mkdir -p dist
      - make -j"$(nproc)" nuphy/halo75_v2/ansi:default
      - make -j"$(nproc)" nuphy/halo75_v2/ansi:via
      - make -j"$(nproc)" nuphy/halo75_v2/iso:default
      - make -j"$(nproc)" nuphy/halo75_v2/iso:via
      - for ext in bin hex uf2; do for f in *.$ext; do [ -f "$f" ] && mv "$f" dist/; done; done
      - cd dist && sha256sum -- * > SHA256SUMS
      - ls -la dist

  - name: publish-nightly
    image: alpine:3.20
    environment:
      FORGEJO_TOKEN:
        from_secret: forgejo_token
      CI_FORGE_URL: "${CI_FORGE_URL}"
      CI_REPO: "${CI_REPO}"
      CI_COMMIT_SHA: "${CI_COMMIT_SHA}"
    commands:
      - apk add --no-cache curl jq
      - export FORGE_URL="${CI_FORGE_URL%/}"
      - case "$FORGE_URL" in http://*|https://*) ;; *) FORGE_URL="https://$FORGE_URL" ;; esac
      - export NIGHTLY_TAG="nightly-$(date -u +%Y-%m-%d)"
      - export REPO_API="$FORGE_URL/api/v1/repos/$CI_REPO"
      - export API="$REPO_API/releases"
      - export AUTH="Authorization: token $FORGEJO_TOKEN"
      - curl -fsSL -H "$AUTH" "$REPO_API" >/dev/null
      - existing="$(curl -fsSL -H "$AUTH" "$API/tags/$NIGHTLY_TAG" 2>/dev/null || echo '{}')" && existing_id="$(printf '%s' "$existing" | jq -r '.id // empty')" && if [ -n "$existing_id" ]; then curl -fsSL -X DELETE -H "$AUTH" "$API/$existing_id"; fi
      - body="Automated nightly build from commit $CI_COMMIT_SHA on $(date -u +%Y-%m-%dT%H:%M:%SZ)."
      - rel_response="$(curl -fsSL -X POST -H "$AUTH" -H 'Content-Type: application/json' "$API" -d "$(jq -nc --arg t "$NIGHTLY_TAG" --arg c "$CI_COMMIT_SHA" --arg b "$body" '{tag_name:$t,target_commitish:$c,name:$t,body:$b,prerelease:true,draft:false}')")"
      - rel_id="$(printf '%s' "$rel_response" | jq -r '.id // empty')" && test -n "$rel_id"
      - for f in dist/*; do [ -f "$f" ] || continue; curl -fsSL -X POST -H "$AUTH" -F "attachment=@$f" "$API/$rel_id/assets?name=$(basename "$f")" >/dev/null; done
