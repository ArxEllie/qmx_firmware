# Nightly build flow.
# Run on a schedule via a Woodpecker cron job named "nightly"
# (Repo Settings -> Crons).
#
# Always compiles every target (catches breakage from upstream merges) and
# publishes/refreshes a rolling "nightly" pre-release on Forgejo.
#
# Note: this PUBLISHES, so it is intentionally not on the `manual` event -
# use build.yaml to manually test a build without side effects.

when:
  - event: cron
    cron: nightly
  - event: manual

steps:
  - name: build
    image: qmkfm/qmk_cli
    commands:
      - sh .woodpecker/scripts/build.sh

  - name: publish-nightly
    image: alpine:3.20
    environment:
      FORGEJO_TOKEN:
        from_secret: forgejo_token
      CI_REPO: "${CI_REPO}"
      CI_COMMIT_SHA: "${CI_COMMIT_SHA}"
    commands:
      - apk add --no-cache curl jq
      - sh .woodpecker/scripts/publish-forgejo.sh nightly true "Nightly build"
      - echo ":::: API connectivity test"
      - curl -fsSL -H "Authorization: token ${FORGEJO_TOKEN}" "${CI_FORGE_URL}/api/v1/repos/${CI_REPO}" | jq -r '.full_name // "FAILED"'
