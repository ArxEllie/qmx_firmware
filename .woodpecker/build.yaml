# Build check.
# Compiles every target WITHOUT publishing anything - safe for testing.
# Trigger it manually from the Woodpecker UI ("Run pipeline" / manual event),
# and it also runs automatically on pull requests.
# Add a `push` entry below if you also want a build on every commit.

when:
  - event: manual
  - event: pull_request

steps:
  - name: build
    image: qmkfm/qmk_cli
    commands:
      - export QMK_HOME="$CI_WORKSPACE"
      - pip install -q -r requirements.txt
      - make git-submodule
      - mkdir -p dist
      - qmk compile -kb nuphy/halo75_v2/ansi -km default
      - qmk compile -kb nuphy/halo75_v2/ansi -km via
      - qmk compile -kb nuphy/halo75_v2/iso -km default
      - qmk compile -kb nuphy/halo75_v2/iso -km via
      - for ext in bin hex uf2; do for f in *.$ext; do [ -f "$f" ] && mv "$f" dist/; done; done
      - cp keyboards/nuphy/halo75_v2/ansi/keymaps/via/NuPhy\ Halo75\ via3.json dist/nuphy_halo75_v2_ansi_via.json
      - cp keyboards/nuphy/halo75_v2/iso/keymaps/via/NuPhy\ Halo75\ via3.json dist/nuphy_halo75_v2_iso_via.json
      - (cd dist && sha256sum -- * > SHA256SUMS)
      - ls -la dist
