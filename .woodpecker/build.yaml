# Build check.
# Compiles every target WITHOUT publishing anything - safe for testing.
# Trigger it manually from the Woodpecker UI ("Run pipeline" / manual event),
# and it also runs automatically on pull requests.
# Add a `push` entry below if you also want a build on every commit.

when:
  - event: manual
  - event: pull_request

steps:
  - name: build
    image: qmkfm/qmk_cli
    commands:
      - pip install -q -r requirements.txt
      - make git-submodule
      - mkdir -p dist
      - make -j"$(nproc)" nuphy/halo75_v2/ansi:default
      - make -j"$(nproc)" nuphy/halo75_v2/ansi:via
      - make -j"$(nproc)" nuphy/halo75_v2/iso:default
      - make -j"$(nproc)" nuphy/halo75_v2/iso:via
      - for ext in bin hex uf2; do for f in *.$ext; do [ -f "$f" ] && mv "$f" dist/; done; done
      - (cd dist && sha256sum -- * > SHA256SUMS)
      - ls -la dist
